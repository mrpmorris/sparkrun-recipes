# Model:
# https://huggingface.co/unsloth/Qwen3.8-27B-NVFP4
#
# Unsloth Dynamic v3.0 NVFP4 quant of Qwen/Qwen3.8-27B (compressed-tensors;
# vLLM auto-detects quantization from config.json, so no --quantization flag).

recipe_version: '2'

model: unsloth/Qwen3.8-27B-NVFP4

runtime: vllm
builder: eugr
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

min_nodes: 1
max_nodes: 1

metadata:
  description: "Qwen3.8-27B NVFP4 (Unsloth Dynamic v3) - compressed-tensors, 262K context, MTP 3, multimodal"
  model_params: 27B
  model_dtype: nvfp4

defaults:
  host: 0.0.0.0
  port: 8000
  served_model_name: unsloth/Qwen3.8-27B-NVFP4
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_seqs: 16
  max_num_batched_tokens: 16384
  load_format: fastsafetensors
  attention_backend: flashinfer
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder
  # Model ships model_mtp.safetensors; drop this line if spec-decode fails with the compressed-tensors quant.
  speculative_config: '{"method":"mtp","num_speculative_tokens":3}'

env:
  VLLM_TARGET_DEVICE: cuda
  HF_TOKEN: "${HF_TOKEN}"

command: |
  vllm serve {model} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel} \
    --trust-remote-code \
    --attention-backend {attention_backend} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --limit-mm-per-prompt '{"image":4}' \
    --speculative-config '{speculative_config}' \
    --load-format {load_format} \
    --reasoning-parser {reasoning_parser} \
    --tool-call-parser {tool_call_parser} \
    --enable-auto-tool-choice
