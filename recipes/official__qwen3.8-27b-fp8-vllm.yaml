# Model:
# https://huggingface.co/Qwen/Qwen3.8-27B-FP8
#
# Verbatim copy of the built-in @official/qwen3.8-27b-fp8-mtp-vllm recipe
# (sparkrun export recipe, 2026-08-17) with MTP speculative decoding removed:
# speculative_config dropped from defaults, --speculative-config dropped from
# command. Every other knob is byte-identical, so this recipe is a clean
# control for the -mtp run.
#
# Why MTP is off: with spec decoding enabled, vLLM's prompt_logprobs path
# returns NaN, which the API serialiser rejects as
#   HTTP 400 "Out of range float values are not JSON compliant: nan".
# lm-eval scores multiple-choice by prompt_logprobs (echo=true, max_tokens=0),
# so MMLU/ARC/HellaSwag either 400 out or come back at chance level
# (MMLU 0.2895, HellaSwag 0.26 on the -mtp runs vs 0.8561 / 0.61 for the
# non-MTP Qwen3.6-27B-FP8 sibling on the same fp8 KV cache). Generative tasks
# (gsm8k, humaneval, mbpp, bfcl) are unaffected either way.
# Use the -mtp recipe for the speed ladder, this one for intelligence.

recipe_version: '2'

model: Qwen/Qwen3.8-27B-FP8

runtime: vllm
builder: eugr
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly:latest

metadata:
  description: "Qwen3.8-27B-FP8 - native FP8 format, no speculative decoding"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  pipeline_parallel: 1
  gpu_memory_utilization: 0.8
  max_model_len: 262144
  max_num_batched_tokens: 16384
  load_format: instanttensor
  kv_cache_dtype: fp8
  attention_backend: flashinfer
  tool_call_parser: qwen3_coder
  reasoning_parser: qwen3
  mm_encoder_tp_mode: data

command: |
  vllm serve {model} \
    --host {host} \
    --port {port} \
    --max-model-len {max_model_len} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-auto-tool-choice \
    --tool-call-parser {tool_call_parser} \
    --reasoning-parser {reasoning_parser} \
    --kv-cache-dtype {kv_cache_dtype} \
    --load-format {load_format} \
    --mm-encoder-tp-mode {mm_encoder_tp_mode} \
    --attention-backend {attention_backend} \
    --enable-prefix-caching \
    -tp {tensor_parallel} \
    -pp {pipeline_parallel}
